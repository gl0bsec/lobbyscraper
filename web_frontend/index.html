<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EU Initiatives Archive</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                LobbySpy
            </div>
            <div class="header-subtitle">
                Doorzoek meer dan 3.800 initiatieven van het EU Better Regulation Portal.
                <br>Krachtige zoekmogelijkheden voor transparante overheidsinformatie.
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Zoek over elk onderwerp..."
            />
            <button class="clear-search" id="clearSearch" style="display: none;">×</button>
            <button class="search-button" id="searchButton">→</button>
        </div>

        <!-- Filters -->
        <div class="filters-container">
            <div class="filter-group">
                <select id="topicFilter" class="filter-select">
                    <option value="">All Topics</option>
                </select>
                <button class="filter-clear" data-filter="topic">×</button>
            </div>

            <div class="filter-group">
                <select id="feedbackFilter" class="filter-select">
                    <option value="">All Feedback Status</option>
                </select>
                <button class="filter-clear" data-filter="feedback">×</button>
            </div>

            <div class="filter-group date-filter">
                <input type="date" id="startDate" class="date-input" placeholder="Start Date">
                <span class="date-separator">-</span>
                <input type="date" id="endDate" class="date-input" placeholder="End Date">
                <button class="filter-clear" data-filter="date">×</button>
            </div>
        </div>


        <!-- Results Info -->
        <div id="resultsInfo" class="results-info" style="display: none;">
            Your search resulted in <span id="resultCount">0</span> results
            <a href="#" id="downloadCSV" class="download-link">↓ Download CSV Data Sample</a>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="results-container">
            <!-- Results will be inserted here -->
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            Loading initiatives...
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
            <p>Enter a search term or apply filters to explore EU initiatives</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
